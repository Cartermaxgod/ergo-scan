<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERGOTHRONE | Scan Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0a0a0a;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .container {
      text-align: center;
      max-width: 700px;
      padding: 20px;
    }

    .logo {
      font-size: 14px;
      letter-spacing: 4px;
      color: #888;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 48px;
      font-weight: 600;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    p {
      font-size: 18px;
      color: #999;
      line-height: 1.6;
    }

    .footer {
      position: absolute;
      bottom: 20px;
      right: 25px;
      font-size: 12px;
      color: #666;
      letter-spacing: 2px;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 32px;
      }

      p {
        font-size: 15px;
      }

      .footer {
        font-size: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">ERGOTHRONE</div>
    <h1>QR VERIFICATION PORTAL</h1>
    <p>
      Our authentication platform is currently under development.<br>
      Product verification system coming soon.
    </p>
  </div>

  <div class="footer">
    MADE FOR ERGO
  </div>

</body>
</html>
